name: Dashboardius CI

# One repository, one web surface: a build, a unit suite, a browser suite, and a
# deploy that only runs when all three are green on main.
#
# Cloudflare auth is org-level — the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable that every other Sneat site already uses — so
# there is nothing per-repo to provision beyond the one-time custom domain.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboardius-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # PRIMEUI_LICENSE is optional: PrimeNG shows its own licence banner when
      # the key is absent, which is a visible reminder rather than a build
      # failure. See web/scripts/write-primeui-license.mjs.
      - name: Build (prerenders the homepage)
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: pnpm build
      # The prerender assertions read the built HTML, so they run here rather
      # than in the browser job — they are checking what SHIPPED, not what a
      # hydrated page looks like.
      - name: Check the prerendered homepage
        run: pnpm exec playwright test e2e/prerender.spec.ts --project=chromium

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test --project=chromium --project=mobile
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [verify, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
    with:
      working-directory: web
      build-command: pnpm build
      wrangler-config: wrangler.jsonc
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      smoke-command: >-
        node scripts/post-deploy-smoke.mjs https://dashboardius.com
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
