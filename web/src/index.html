<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboardius — Any data. Your metrics. One view.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Dashboardius builds, shows, edits and shares dashboards. The homepage is a working board: move cards, add hidden metrics, ask for changes in a sentence, reset when you are done. Powered by DataTug queries."
    />
    <link rel="canonical" href="https://dashboardius.com/" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dashboardius" />
    <meta property="og:url" content="https://dashboardius.com/" />
    <meta property="og:title" content="Dashboardius — Any data. Your metrics. One view." />
    <meta
      property="og:description"
      content="A dashboard product whose homepage is a dashboard. Move cards, add hidden metrics, ask for changes in a sentence, reset when you are done."
    />
    <meta property="og:image" content="https://dashboardius.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dashboardius demo board: charts, stat tiles and a DataTug query card." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dashboardius — Any data. Your metrics. One view." />
    <meta
      name="twitter:description"
      content="A dashboard product whose homepage is a dashboard. Move cards, add hidden metrics, ask for changes in a sentence, reset when you are done."
    />
    <meta name="twitter:image" content="https://dashboardius.com/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dashboardius",
        "url": "https://dashboardius.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Dashboardius builds, shows, edits and shares dashboards. Cards can be charts, tables, stat tiles or prose; a card's data comes from a DataTug query, and a board is a DataTug board.",
        "isPartOf": { "@type": "WebSite", "name": "Sneat", "url": "https://sneat.co" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <!-- Applies the stored colour-scheme choice before first paint, so a visitor
         who picked dark never sees a white flash on the way in. Inline on
         purpose: a request for this would be a request too late. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('dashboardius.theme');
          if (c === 'dark') document.documentElement.classList.add('db-dark');
          else if (c === 'light') document.documentElement.classList.add('db-light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <db-root></db-root>
  </body>
</html>
